<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Ball Sort" />
  <meta name="theme-color" content="#0F1923" />
  <title>Ball Sort</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; background: #0F1923; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; overflow: hidden; }
    body { display: flex; flex-direction: column; }

    #header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 16px 20px; border-bottom: 1px solid rgba(255,255,255,0.08);
      flex-shrink: 0;
    }
    #header-left h1 { font-size: 24px; font-weight: 800; color: #fff; }
    #header-left p { font-size: 14px; color: #7F8C8D; margin-top: 2px; }
    #header-right { display: flex; gap: 10px; }
    .icon-btn {
      width: 44px; height: 44px; border-radius: 12px;
      background: rgba(255,255,255,0.1); border: none; cursor: pointer;
      font-size: 22px; color: #fff; display: flex; align-items: center; justify-content: center;
    }
    .icon-btn:disabled { opacity: 0.3; cursor: default; }
    .icon-btn:active { background: rgba(255,255,255,0.2); }

    #game {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 24px 12px; gap: 12px; overflow: hidden;
    }
    .tube-row { display: flex; gap: 10px; justify-content: center; }

    .tube-wrap {
      display: flex; flex-direction: column; align-items: center;
      cursor: pointer; transition: transform 0.15s ease;
      padding-top: 14px;
    }
    .tube-wrap.selected { transform: translateY(-14px); }
    .tube {
      display: flex; flex-direction: column;
      border: 3px solid #BDC3C7; border-bottom: none;
      border-radius: 3px 3px 0 0;
      overflow: hidden; background: rgba(255,255,255,0.06);
    }
    .tube-wrap.selected .tube { border-color: #F1C40F; }
    .tube-base {
      height: 10px; border-radius: 0 0 8px 8px;
      background: #BDC3C7; transition: background 0.3s;
    }
    .tube-wrap.complete .tube-base { background: #2ECC71; }
    .ball-slot {
      display: flex; align-items: center; justify-content: center;
    }
    .ball {
      border-radius: 50%;
      box-shadow: 0 2px 6px rgba(0,0,0,0.4), inset 0 -2px 4px rgba(0,0,0,0.2), inset 0 2px 4px rgba(255,255,255,0.2);
    }
    .ball.empty { background: transparent !important; box-shadow: none; }

    #hint { text-align: center; color: #556273; font-size: 13px; padding-bottom: 16px; flex-shrink: 0; }

    #win-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.65); align-items: center; justify-content: center; z-index: 100;
    }
    #win-overlay.show { display: flex; }
    #win-card {
      background: #1E2D40; border-radius: 24px; padding: 32px;
      text-align: center; width: 280px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
      animation: pop 0.3s cubic-bezier(0.34,1.56,0.64,1);
    }
    @keyframes pop { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    #win-card .emoji { font-size: 56px; margin-bottom: 8px; }
    #win-card h2 { font-size: 32px; font-weight: 800; color: #F1C40F; margin-bottom: 6px; }
    #win-card p { font-size: 16px; color: #BDC3C7; margin-bottom: 28px; }
    .win-btn {
      display: block; width: 100%; padding: 14px; border-radius: 14px;
      border: none; font-size: 18px; font-weight: 700; cursor: pointer;
    }
    .win-btn.primary { background: #3498DB; color: #fff; margin-bottom: 10px; }
    .win-btn.secondary { background: transparent; color: #7F8C8D; font-size: 15px; font-weight: 400; }
  </style>
</head>
<body>

<div id="header">
  <div id="header-left">
    <h1 id="level-label">Level 1</h1>
    <p id="moves-label">0 moves</p>
  </div>
  <div id="header-right">
    <button class="icon-btn" id="undo-btn" disabled title="Undo">↩</button>
    <button class="icon-btn" id="restart-btn" title="Restart">↺</button>
  </div>
</div>

<div id="game"></div>
<div id="hint">Tap a tube to select it</div>

<div id="win-overlay">
  <div id="win-card">
    <div class="emoji">🎉</div>
    <h2>Sorted!</h2>
    <p id="win-msg"></p>
    <button class="win-btn primary" id="next-btn">Next Level →</button>
    <button class="win-btn secondary" id="replay-btn">Replay</button>
  </div>
</div>

<script>
(function() {
  'use strict';

  const COLORS = ['#E74C3C','#3498DB','#2ECC71','#F39C12','#9B59B6','#1ABC9C','#E91E63','#FF5722','#00BCD4','#8BC34A'];
  const CAPACITY = 4;
  const LEVEL_COLORS = [3,4,4,5,5,6,6,7,7,8,8,9,9,10];

  let level = 1, moves = 0, tubes = [], selectedIdx = null, history = [];

  function numColors(lvl) { return LEVEL_COLORS[Math.min(lvl - 1, LEVEL_COLORS.length - 1)]; }

  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function generateLevel(n) {
    const balls = [];
    for (let i = 0; i < n; i++) for (let j = 0; j < CAPACITY; j++) balls.push(COLORS[i]);
    shuffle(balls);
    const t = [];
    for (let i = 0; i < n; i++) t.push(balls.slice(i * CAPACITY, (i + 1) * CAPACITY));
    t.push([], []);
    return t;
  }

  function topBall(tube) { return tube.length ? tube[tube.length - 1] : null; }
  function isComplete(tube) { return tube.length === CAPACITY && tube.every(b => b === tube[0]); }
  function canMove(from, to) {
    if (!from.length) return false;
    if (isComplete(from)) return false;
    if (to.length >= CAPACITY) return false;
    return !to.length || topBall(to) === topBall(from);
  }
  function checkWin() { return tubes.every(t => !t.length || isComplete(t)); }
  function deepCopy(t) { return t.map(tube => [...tube]); }

  function startLevel() {
    tubes = generateLevel(numColors(level));
    moves = 0; selectedIdx = null; history = [];
    render();
  }

  function selectTube(idx) {
    if (selectedIdx === null) {
      if (!tubes[idx].length || isComplete(tubes[idx])) return;
      selectedIdx = idx;
    } else if (selectedIdx === idx) {
      selectedIdx = null;
    } else if (canMove(tubes[selectedIdx], tubes[idx])) {
      history.push(deepCopy(tubes));
      tubes[idx].push(tubes[selectedIdx].pop());
      moves++;
      selectedIdx = null;
      if (checkWin()) { render(); setTimeout(showWin, 300); return; }
    } else {
      if (tubes[idx].length && !isComplete(tubes[idx])) selectedIdx = idx;
      else selectedIdx = null;
    }
    render();
  }

  function undo() {
    if (!history.length) return;
    tubes = history.pop();
    if (moves > 0) moves--;
    selectedIdx = null;
    render();
  }

  function showWin() {
    document.getElementById('win-msg').textContent =
      `Level ${level} complete in ${moves} ${moves === 1 ? 'move' : 'moves'}`;
    document.getElementById('win-overlay').classList.add('show');
  }

  function getSizes() {
    const rows = tubes.length <= 5 ? 1 : 2;
    const cols = Math.ceil(tubes.length / rows);
    const maxW = (window.innerWidth - 24) / cols - 10;
    const maxH = (window.innerHeight - 160) / CAPACITY - 6;
    const unit = Math.min(maxW, maxH, 64);
    return { unit, ball: unit - 8, base: unit + 6 };
  }

  function render() {
    document.getElementById('level-label').textContent = `Level ${level}`;
    document.getElementById('moves-label').textContent = `${moves} move${moves !== 1 ? 's' : ''}`;
    document.getElementById('undo-btn').disabled = !history.length;

    const { unit, ball, base } = getSizes();
    const game = document.getElementById('game');
    game.innerHTML = '';

    const perRow = tubes.length <= 5 ? tubes.length : Math.ceil(tubes.length / 2);
    for (let r = 0; r * perRow < tubes.length; r++) {
      const row = document.createElement('div');
      row.className = 'tube-row';
      for (let c = r * perRow; c < Math.min((r + 1) * perRow, tubes.length); c++) {
        row.appendChild(makeTube(c, unit, ball, base));
      }
      game.appendChild(row);
    }
  }

  function makeTube(idx, unit, ballSize, baseW) {
    const tube = tubes[idx];
    const wrap = document.createElement('div');
    wrap.className = 'tube-wrap' + (idx === selectedIdx ? ' selected' : '') + (isComplete(tube) ? ' complete' : '');

    const tubeEl = document.createElement('div');
    tubeEl.className = 'tube';
    tubeEl.style.width = unit + 'px';

    for (let s = CAPACITY - 1; s >= 0; s--) {
      const slot = document.createElement('div');
      slot.className = 'ball-slot';
      slot.style.width = unit + 'px';
      slot.style.height = unit + 'px';
      const ballEl = document.createElement('div');
      ballEl.className = 'ball' + (tube[s] ? '' : ' empty');
      ballEl.style.width = ballSize + 'px';
      ballEl.style.height = ballSize + 'px';
      if (tube[s]) ballEl.style.background = tube[s];
      slot.appendChild(ballEl);
      tubeEl.appendChild(slot);
    }

    const baseEl = document.createElement('div');
    baseEl.className = 'tube-base';
    baseEl.style.width = baseW + 'px';

    wrap.appendChild(tubeEl);
    wrap.appendChild(baseEl);
    wrap.addEventListener('click', () => selectTube(idx));
    return wrap;
  }

  document.getElementById('undo-btn').addEventListener('click', undo);
  document.getElementById('restart-btn').addEventListener('click', () => {
    document.getElementById('win-overlay').classList.remove('show');
    startLevel();
  });
  document.getElementById('next-btn').addEventListener('click', () => {
    document.getElementById('win-overlay').classList.remove('show');
    level++;
    startLevel();
  });
  document.getElementById('replay-btn').addEventListener('click', () => {
    document.getElementById('win-overlay').classList.remove('show');
    startLevel();
  });

  window.addEventListener('resize', render);
  startLevel();
})();
</script>
</body>
</html>
